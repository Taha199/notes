name: Apply quiz image cloud save fix

'on':
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    name: Patch and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch quiz image saving
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          rt = Path('src/components/notes/RichTextEditor.tsx')
          text = rt.read_text()
          old = '''  // ── Image ─────────────────────────────────────────────────────────────
  const insertImage = (file: File) => {
    const ed = editorRef.current;
    if (!ed || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const url = reader.result as string;
      ensureFocus(true);
      document.execCommand('insertHTML', false, `<div class="${NOTE_IMG_FRAME}" contenteditable="false" dir="auto"><img src="${url}" loading="lazy" decoding="async" style="display:block;max-width:160px;max-height:160px;height:auto;cursor:zoom-in;" /></div><br>`);
      normalizeEditorImages(ed);
      saveSel();
      emitHtml();
    };
    reader.readAsDataURL(file);
  };
'''
          new = '''  // ── Image ─────────────────────────────────────────────────────────────
  const readFileAsDataUrl = (file: File) => new Promise<string>((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error ?? new Error('Image read failed'));
    reader.readAsDataURL(file);
  });

  const optimizeImageForCloud = async (file: File): Promise<string> => {
    const original = await readFileAsDataUrl(file);
    if (/image\/(gif|svg\+xml)/i.test(file.type)) return original;
    try {
      const img = new Image();
      img.decoding = 'async';
      await new Promise<void>((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = () => reject(new Error('Image decode failed'));
        img.src = original;
      });
      const maxSide = 1400;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
      const width = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
      const height = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      if (!ctx) return original;
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL('image/jpeg', 0.84);
      return compressed.length < original.length ? compressed : original;
    } catch {
      return original;
    }
  };

  const insertImage = async (file: File) => {
    const ed = editorRef.current;
    if (!ed || !file.type.startsWith('image/')) return;
    const url = await optimizeImageForCloud(file);
    ensureFocus(true);
    document.execCommand('insertHTML', false, `<div class="${NOTE_IMG_FRAME}" contenteditable="false" dir="auto"><img src="${url}" loading="lazy" decoding="async" style="display:block;max-width:160px;max-height:160px;height:auto;cursor:zoom-in;" /></div><br>`);
    normalizeEditorImages(ed);
    saveSel();
    flushEmitHtml();
  };
'''
          if old in text:
              text = text.replace(old, new)
          elif 'optimizeImageForCloud' not in text:
              raise SystemExit('Could not find image insert block')
          rt.write_text(text)

          ctx = Path('src/contexts/NotesContext.tsx')
          c = ctx.read_text()
          c = c.replace('persist({ quizSets: nextSets }, false);', 'persist({ quizSets: nextSets }, forceCloud);')
          c = c.replace('persist({ quizSets: next }, false);', 'persist({ quizSets: next }, true);')
          delayed_from = """scheduleInstantDataCloudSave({ quizSets: next });
      return next;"""
          delayed_to = """scheduleInstantDataCloudSave({ quizSets: next });
      window.setTimeout(() => scheduleInstantDataCloudSave({ quizSets: next }), 700);
      return next;"""
          c = c.replace(delayed_from, delayed_to)
          ctx.write_text(c)
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          rm .github/workflows/apply-quiz-image-cloud-save-fix.yml
          git config user.name codex
          git config user.email codex@openai.com
          git add src/components/notes/RichTextEditor.tsx src/contexts/NotesContext.tsx .github/workflows/apply-quiz-image-cloud-save-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix quiz questions with images cloud save"
          git push
