name: Fix files preview and upload speed

on:
  push:
    paths:
      - .github/workflows/fix-files-preview-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch files page
        shell: python
        run: |
          from pathlib import Path

          files_path = Path('src/components/files/FilesPage.tsx')
          text = files_path.read_text()

          old_pdf = """        // PDF: NEVER use Google Docs viewer as success — it blanks on Firebase token URLs.\n        // Race getBytes(storagePath) with /api/file-download?mode=proxy&disposition=inline\n        // into a local blob: URL (application/pdf) for <object>/<iframe>.\n        if (mode === 'pdf') {\n          const quickPath =\n            file.storagePath\n            || (file.downloadUrl ? storagePathFromDownloadUrl(file.downloadUrl) : undefined)\n            || guessStoragePath(file, uid);\n          setLoadPct(15);\n\n          const resolved: ResolvedFile = {\n            href: file.downloadUrl || '',\n            storagePath: quickPath,\n            dataUrl: file.dataUrl,\n          };\n\n          const blob = await loadFileBlob(\n            resolved,\n            'application/pdf',\n            remainingMs(deadline),\n            file.id,\n          );\n          if (!isLive()) return;\n          if (quickPath && quickPath !== file.storagePath) {\n            onMetaRef.current?.({ storagePath: quickPath });\n          }\n          showObjectUrl(coerceMime(blob, 'application/pdf'));\n          return;\n        }\n"""
          new_pdf = """        // PDF: paint a streamable URL first so preview opens immediately.\n        // Downloading the whole PDF into a blob made preview feel broken on slow links.\n        if (mode === 'pdf') {\n          const quickPath =\n            file.storagePath\n            || (file.downloadUrl ? storagePathFromDownloadUrl(file.downloadUrl) : undefined)\n            || guessStoragePath(file, uid);\n          const quickHref = file.downloadUrl || file.dataUrl || '';\n          setLoadPct(15);\n\n          if (quickHref && !quickHref.startsWith('blob:')) {\n            if (quickPath && quickPath !== file.storagePath) {\n              onMetaRef.current?.({ storagePath: quickPath });\n            }\n            paintDirect(quickHref);\n            return;\n          }\n\n          try {\n            const fresh = await withTimeout(\n              refreshViaFileApi(file.id, { path: quickPath }),\n              Math.min(RESOLVE_TIMEOUT_MS, remainingMs(deadline)),\n              'api-refresh-timeout',\n            );\n            if (!isLive()) return;\n            if (fresh?.href || fresh?.dataUrl) {\n              onMetaRef.current?.({\n                downloadUrl: fresh.href?.startsWith('http') ? fresh.href : undefined,\n                storagePath: fresh.storagePath || quickPath,\n              });\n              paintDirect(fresh.href || fresh.dataUrl || '');\n              return;\n            }\n          } catch {\n            pass\n          }\n\n          const resolved: ResolvedFile = {\n            href: '',\n            storagePath: quickPath,\n            dataUrl: file.dataUrl,\n          };\n          const blob = await loadFileBlob(\n            resolved,\n            'application/pdf',\n            remainingMs(deadline),\n            file.id,\n          );\n          if (!isLive()) return;\n          if (quickPath && quickPath !== file.storagePath) {\n            onMetaRef.current?.({ storagePath: quickPath });\n          }\n          showObjectUrl(coerceMime(blob, 'application/pdf'));\n          return;\n        }\n""".replace('            pass', "            /* fall back to authenticated bytes below */")
          if old_pdf not in text:
            raise SystemExit('PDF preview block not found')
          text = text.replace(old_pdf, new_pdf)

          old_upload = """      for (const file of selected) {\n        const stored = await uploadOneFile(file, currentFolderId);\n        await saveFileMeta(stored);\n        uploaded.push(stored);\n      }\n      if (uploaded.length) {\n        setFiles((prev) => [...uploaded, ...prev]);\n        show(uploaded.length === 1 ? t.filesUploadSuccess : `${uploaded.length} ${t.filesUploadSuccess}`);\n      }\n"""
          new_upload = """      const CONCURRENT_UPLOADS = 3;\n      for (let i = 0; i < selected.length; i += CONCURRENT_UPLOADS) {\n        const chunk = selected.slice(i, i + CONCURRENT_UPLOADS);\n        const storedChunk = await Promise.all(chunk.map((file) => uploadOneFile(file, currentFolderId)));\n        uploaded.push(...storedChunk);\n        setFiles((prev) => [...storedChunk, ...prev]);\n      }\n\n      if (uploaded.length) {\n        const updates = Object.fromEntries(uploaded.map((file) => [file.id, file]));\n        const res = await rtdbFetch(`/users/${user.uid}/files`, {\n          method: 'PATCH',\n          body: JSON.stringify(updates),\n          headers: { 'Content-Type': 'application/json' },\n        });\n        if (!res.ok) throw new Error('save-failed');\n        show(uploaded.length === 1 ? t.filesUploadSuccess : `${uploaded.length} ${t.filesUploadSuccess}`);\n      }\n"""
          if old_upload not in text:
            raise SystemExit('Upload loop block not found')
          text = text.replace(old_upload, new_upload)
          files_path.write_text(text)

          Path('.github/workflows/fix-files-preview-upload.yml').unlink(missing_ok=True)
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add src/components/files/FilesPage.tsx .github/workflows/fix-files-preview-upload.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix file preview and speed up uploads"
          git push
